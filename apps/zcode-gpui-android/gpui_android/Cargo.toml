[package]
name = "gpui_android"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"
# Vendored from github.com/Dylanmurzello/zed-android-port crates/gpui_android
# (Apache-2.0) @ 1755a0d45865f985bbfa27f65350a840c7df52d2, adapted to zed 1a28cff.

[lib]
path = "src/gpui_android.rs"

[target.'cfg(target_os = "android")'.dependencies]
gpui.workspace = true
gpui_wgpu.workspace = true
android-activity = { version = "0.6", features = ["game-activity"] }
anyhow.workspace = true
jni = "0.21"
calloop = "0.14.3"
futures.workspace = true
libc.workspace = true
log.workspace = true
ndk = { version = "0.9", features = ["nativewindow", "api-level-26"] }
raw-window-handle = "0.6"
serde_json.workspace = true
ureq = { version = "2", default-features = false, features = ["tls"] }
util.workspace = true
uuid.workspace = true
zip = "2"
rand = { version = "0.9", features = ["small_rng"] }
parking_lot = "0.12.1"
