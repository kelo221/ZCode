[package]
name = "zcode-gpui"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Minimal native GPUI frontend for the ZCode agent backend"
# src/bin/zcode-browser-host.rs is a second binary; `cargo run` means the app.
default-run = "zcode-gpui"

[dependencies]
# gpui: pinned to the exact zed revision that ely-gpui-component targets so both
# crates build ONE shared gpui (cargo cannot unify a crates.io and a git source
# of the same crate, and the platform backends only exist in the zed repo). The
# previous crates.io 0.2.2 pin (2025-10) was a year behind zed main, which made
# third-party gpui component libraries impossible to mount.
gpui = { git = "https://github.com/zed-industries/zed", rev = "1a28cff4b409169bac058bca40dfbfeb7621d19b" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1a28cff4b409169bac058bca40dfbfeb7621d19b" }
# UI component library (MIT / Apache-2.0) driving the visual language; see
# THIRD-PARTY-NOTICES.md. Vendored at rev 2f8b2f6 (vendor/ely-gpui-component/VENDORED.md)
# because its git repository is no longer reachable.
ely-gpui-component = { path = "vendor/ely-gpui-component" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5.8"
uuid = { version = "1", features = ["v7"] }
futures = "0.3"
base64 = "0.22"
sha2 = "0.10"
crc32fast = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff", "pnm"] }
pulldown-cmark = "0.13.4"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
portable-pty = "0.9.0"
alacritty_terminal = "0.26.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
ring = "0.17"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
qrcode = { version = "0.14", default-features = false }
# @ file mentions: gitignore-aware parallel walk and change watcher.
ignore = "0.4"
notify = { version = "8", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Globalization",
    "Win32_System_Diagnostics_ToolHelp",
    # ShellExecuteW for the system file opener (no cmd.exe in the path).
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # CoCreateInstance for the native folder picker (IFileDialog).
    "Win32_System_Com",
    # GetLocalTime for the draft greeting's time of day.
    "Win32_System_SystemInformation",
    # HKCU native messaging host registration for the browser bridge.
    "Win32_System_Registry",
] }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "1a28cff4b409169bac058bca40dfbfeb7621d19b", features = ["test-support"] }

[build-dependencies]
serde_json = "1"

[profile.dev]
opt-level = 1
