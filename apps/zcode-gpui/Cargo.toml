[package]
name = "zcode-gpui"
version = "0.1.0"
edition = "2024"
description = "Minimal native GPUI frontend for the ZCode agent backend"

[dependencies]
# gpui: pinned to the exact zed revision that ely-gpui-component targets so both
# crates build ONE shared gpui (cargo cannot unify a crates.io and a git source
# of the same crate, and the platform backends only exist in the zed repo). The
# previous crates.io 0.2.2 pin (2025-10) was a year behind zed main, which made
# third-party gpui component libraries impossible to mount.
gpui = { git = "https://github.com/zed-industries/zed", rev = "1a28cff4b409169bac058bca40dfbfeb7621d19b" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1a28cff4b409169bac058bca40dfbfeb7621d19b" }
# UI component library (MIT / Apache-2.0) driving the visual language; see
# THIRD-PARTY-NOTICES.md. Rev-pinned alongside the gpui rev above.
ely-gpui-component = { git = "https://github.com/ZacharyZhang-NY/Ely-GPUI-Components", rev = "2f8b2f687cd1e9b98a7cd29d4e882d09406fc547" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7"] }
futures = "0.3"
base64 = "0.22"
sha2 = "0.10"
crc32fast = "1"
pulldown-cmark = "0.13.4"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
portable-pty = "0.9.0"
alacritty_terminal = "0.26.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    # ShellExecuteW for the system file opener (no cmd.exe in the path).
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
serde_json = "1"

[profile.dev]
opt-level = 1
