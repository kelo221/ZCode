[package]
name = "zcode-gpui"
version = "0.1.0"
edition = "2024"
description = "Minimal native GPUI frontend for the ZCode agent backend"

[dependencies]
# gpui-ce is the community fork of Zed's gpui (same framework, same API).
# Its 0.2.2 crates.io publish is missing the platform crates, so we build
# against Zed's identical-version `gpui` release until gpui-ce ships a
# complete one; the import surface (gpui::*) stays the same.
gpui = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7"] }
futures = "0.3"
base64 = "0.22"
crc32fast = "1"
pulldown-cmark = "0.13.4"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
portable-pty = "0.9.0"
alacritty_terminal = "0.26.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
] }

[profile.dev]
opt-level = 1
