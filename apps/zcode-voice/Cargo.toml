[package]
name = "zcode-voice"
version = "0.1.0"
edition = "2024"
publish = false
description = "Unofficial ZCode GPUI text-to-speech sidecar (kokoro-tiny)"
license = "GPL-3.0-or-later"

# Desktop-only sidecar spawned by apps/zcode-gpui (see apps/zcode-gpui/VOICE.md).
# It statically links espeak-ng (GPL-3.0) through kokoro-tiny/espeak-rs, which is
# why it is a separate executable rather than a zcode-gpui dependency.

[dependencies]
# crates.io only has 0.1.0, which lacks `with_paths`; pin the 0.2.0 tree.
# `playback` stays off: we play through our own rodio sink so speech can be
# stopped and always uses the system default output device.
kokoro-tiny = { git = "https://github.com/8b-is/kokoro-tiny", rev = "0ca44ce6c299c5832f73e2a9bd28265b5bbef655", default-features = false }
# kokoro-tiny asks for ort ^2.0.0-rc.11, but rc.14 changed `Session::builder`;
# this exact pin only constrains the shared resolution.
ort = { version = "=2.0.0-rc.11", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rodio = { version = "0.17", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
ndarray-npy = { path = "vendor/ndarray-npy" }

[profile.dev]
opt-level = 1

[profile.release]
strip = true
