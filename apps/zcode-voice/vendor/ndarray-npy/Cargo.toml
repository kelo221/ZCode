# Vendored ndarray-npy 0.10.0 (MIT OR Apache-2.0, see LICENSE-*), patched in by
# apps/zcode-voice. Only change: every zip 5.x-7.x release is yanked on
# crates.io, so the published `zip = "6"` requirement can no longer resolve.
# The zip requirement is raised to 9; tests and examples are dropped.

[package]
edition = "2021"
rust-version = "1.84"
name = "ndarray-npy"
version = "0.10.0"
authors = ["Jim Turner <ndarray-npy@turner.link>"]
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = ".npy and .npz file format support for ndarray"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jturner314/ndarray-npy"

[features]
compressed_npz = ["npz", "zip/deflate"]
default = ["compressed_npz", "num-complex-0_4"]
npz = ["zip"]

[lib]
name = "ndarray_npy"
path = "src/lib.rs"

[dependencies.byteorder]
version = "1.3.2"

[dependencies.ndarray]
version = "0.17.1"

[dependencies.num-complex-0_4]
version = "0.4"
optional = true
package = "num-complex"

[dependencies.num-traits]
version = "0.2"

[dependencies.py_literal]
version = "0.4"

[dependencies.zip]
version = "9"
optional = true
default-features = false
