name: gpui-frontend

on:
  push:
    paths: ["apps/zcode-gpui/**", ".github/workflows/gpui.yml"]
  pull_request:
    paths: ["apps/zcode-gpui/**", ".github/workflows/gpui.yml"]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/zcode-gpui
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libfontconfig1-dev libfreetype6-dev \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxrandr-dev libxi-dev libxcursor-dev libvulkan-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/zcode-gpui
      - name: Format check
        if: runner.os == 'Windows'
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
